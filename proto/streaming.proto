syntax = "proto3";

package streaming;

import "common/empty.proto";
import "common/error.proto";
import "common/ping.proto";
import "battle.proto";
//import "ai.proto";

message BattleRequest {
  oneof input {
    BattleStart      start     = 1;
    BattleMove       move      = 2;
    common.ping.Ping ping      = 3;
    BattleLeave      leave     = 4;
    BattleJoinAi     connectAi = 6;
  }
}

message BattleResponse {
  oneof output {
    battle.BattleObject      battle = 1;
    common.empty.Empty       ping   = 2;
    common.error.ErrorObject error  = 3;
  }
}

message BattleStart {
  string battle_id = 1;
}

message BattleLeave {
  string battle_id = 1;
}

message BattleJoinAi {
  string battle_id = 1;
}

message BattleMove {
  string battle_id = 1;
  int32  cell_idx  = 2;
}

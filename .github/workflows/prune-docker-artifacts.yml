name: Prune docker artifacts

on:
  repository_dispatch:
    types:
      - service-updated

  workflow_dispatch:

run-name: Prune docker artifacts

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - name: Check environment
        run: |
          echo "Environment: dev"
          test -n "${{ secrets.DEPLOY_HOST }}" || exit 1
          test -n "${{ secrets.DEPLOY_USER }}" || exit 1
          test -n "${{ secrets.DEPLOY_KEY }}" || exit 1
          echo "✅ All deploy secrets are available"

syntax = "proto3";

import "common/empty.proto";
import "auth.proto";

package profile;

service Profile {
  rpc GetMy (common.empty.Empty) returns (ProfileObject);
  rpc GetProfileByUser (auth.UserIdRequest) returns (ProfileObject);
  rpc GetProfile (profile.ProfileIdRequest) returns (ProfileObject);
  rpc UpsertProfile (auth.UserIdRequest) returns (ProfileObject);
}

message ProfileIdRequest {
  string profile_id = 1;
}

message ProfileObject {
  string id         = 1;
  string user_id    = 2;
  string nickname   = 3;
  int64  level      = 4;
  int64  rating     = 5;
  int64  experience = 6;
  int64  createdAt  = 7;
  int64  updatedAt  = 8;
}

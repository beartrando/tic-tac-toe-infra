name: Deploy Node App

on:
  repository_dispatch:
    types:
      - service-updated

run-name: Deploy ${{ github.event.client_payload.service }}

concurrency:
  group: deploy-${{ github.event.client_payload.service }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    environment: ${{ github.event.client_payload.branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Print payload
        run: |
          echo "Repo: ${{ github.event.client_payload.repo }}"
          echo "Service: ${{ github.event.client_payload.service }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"
          echo "Version: ${{ github.event.client_payload.version }}"
          echo "Sha: ${{ github.event.client_payload.sha }}"

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Checkout service submodule branch
        run: |
          cd services/${{ github.event.client_payload.service }}
          git fetch origin ${{ github.event.client_payload.branch }}
          git checkout ${{ github.event.client_payload.branch }}
          git pull origin ${{ github.event.client_payload.branch }}

      # 🔑 Добавляем buildx и cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.event.client_payload.service }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.event.client_payload.service }}-

      - name: Build Docker image
        run: |
          docker buildx build \
            --target prod \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.event.client_payload.version }} \
            -f services/${{ github.event.client_payload.service }}/Dockerfile .

          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.event.client_payload.branch }}

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/service:latest

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/service:${{ github.sha }}

          docker buildx build \
            --target predeploy \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            -t $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }} \
            -f services/${{ github.event.client_payload.service }}/Dockerfile .

          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.branch }}

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:latest

          docker tag $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }} \
            $REGISTRY/${{ github.event.client_payload.repo }}/predeploy:${{ github.sha }}


  deploy:
    environment: ${{ github.event.client_payload.branch }}
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            bash -eo pipefail <<'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            docker run \
              --rm --env-file ./services/.env.${{ github.event.client_payload.service }} \
              --network game_backend \
              ghcr.io/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }}

            docker compose pull
            docker compose up -d ${{ github.event.client_payload.service }} --remove-orphans
            docker image prune -f
            docker system prune -a
            EOF





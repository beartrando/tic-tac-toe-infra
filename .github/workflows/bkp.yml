name: Deploy Docker Compose

on:
  workflow_dispatch:
#  workflow_run:
#    workflows:
#      - Build and Push Node App
#    types:
#      - completed

run-name: Deploy ${{ github.event.client_payload.service }} service

jobs:
  deploy:
    environment: ${{ github.event.client_payload.branch }}
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            set -o pipefail

            cd ${{ secrets.DEPLOY_PATH }}

            LOCK_DIR="/tmp/deploy-lock"
            SERVICE="${{ github.event.client_payload.service }}"
            LOCK_FILE="$LOCK_DIR/$SERVICE"

            mkdir -p "$LOCK_DIR"
            touch "$LOCK_FILE"

            cleanup() {
                rm -f "$LOCK_FILE"
            }

            trap cleanup EXIT

            docker run \
              --rm \
              --env-file "./services/.env.$SERVICE" \
              --network tic-tac-toe_backend \
              "ghcr.io/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }}"

            docker rmi "ghcr.io/${{ github.event.client_payload.repo }}/predeploy:${{ github.event.client_payload.version }}"

            OLD_IMAGE=$(docker inspect \
              "$(docker compose ps -q "$SERVICE")" \
              --format '{{.Image}}' 2>/dev/null || true)

            docker compose pull "$SERVICE"

            docker compose up -d "$SERVICE" --remove-orphans

            if [ -n "$OLD_IMAGE" ]; then
              docker rmi "$OLD_IMAGE" 2>/dev/null || true
            fi

            rm -f "$LOCK_FILE"

            LOCK_COUNT=$(find "$LOCK_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l)

            echo "Active deployment locks: $LOCK_COUNT"

            if [ "$LOCK_COUNT" -eq 0 ]; then
              echo "🧹 No active deployments. Run docker prune."

              docker image prune -f
              docker system prune -af
            fi

            if [ "$LOCK_COUNT" -ne 0 ]; then
              echo "⏭️ Active deployments detected. Skip docker prune."
            fi


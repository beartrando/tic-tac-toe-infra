apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
spec:
  replicas: 1

  selector:
    matchLabels:
      app: bot

  template:
    metadata:
      labels:
        app: bot

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bot
          image: ghcr.io/beartrando/tic-tac-toe-bot/service

          ports:
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: bot-env
            - secretRef:
                name: bot-env

          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
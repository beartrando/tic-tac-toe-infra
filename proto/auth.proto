syntax = "proto3";

import "common/empty.proto";

package auth;

service Auth {
  rpc Register (RegisterRequest) returns (AuthObject);
  rpc Login (LoginRequest) returns (AuthObject);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc RefreshTokens (RefreshTokensRequest) returns (AuthObject);
  rpc ForgotPassword (ForgotPasswordRequest) returns (common.empty.Empty);
  rpc ResetPassword (ResetPasswordRequest) returns (AuthObject);
  rpc AnonymousSignIn (AnonymousSignInRequest) returns (AuthObject);
  rpc GetUser (UserIdRequest) returns (UserObject);
  rpc GetMy (common.empty.Empty) returns (UserObject);
}

message RegisterRequest {
  string email    = 1;
  string password = 2;
}

message UserObject {
  string id         = 1;
  string email      = 2;
  int64  createdAt  = 3;
  int64  updatedAt  = 4;
}

message UserIdRequest {
  string user_id = 1;
}

message AuthObject {
  string access_token  = 1;
  string refresh_token = 2;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message RefreshTokensRequest {
  string token = 1;
}

message LogoutRequest {
  string user_id = 1;
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token        = 1;
  string new_password = 2;
}

message AnonymousSignInRequest {
  string device_id = 1;
}
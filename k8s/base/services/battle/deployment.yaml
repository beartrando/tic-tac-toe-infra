apiVersion: apps/v1
kind: Deployment
metadata:
  name: battle
spec:
  replicas: 1

  selector:
    matchLabels:
      app: battle

  template:
    metadata:
      labels:
        app: battle

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: battle
          image: ghcr.io/beartrando/tic-tac-toe-battle/service

          ports:
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: battle-env
            - secretRef:
                name: battle-env

          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
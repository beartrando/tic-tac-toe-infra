apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: auth
          image: ghcr.io/beartrando/auth/service

          ports:
            - containerPort: 50051

          envFrom:
            - configMapRef:
                name: auth-env
            - secretRef:
                name: auth-env

          env:
            - name: KAFKAJS_NO_PARTITIONER_WARNING
              value: "1"

          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:50051
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
name: Deploy Docker Compose

on:
  repository_dispatch:
    types:
      - deploy-docker

run-name: Deploy ${{ github.event.client_payload.service }} service

concurrency:
  group: deploy-${{ github.event.client_payload.service }}
  cancel-in-progress: true

jobs:
  deploy:
    environment: ${{ github.event.client_payload.branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            set -o pipefail

            echo "=== Docker Compose deploy started ==="
            echo "Workflow: ${{ github.event.client_payload.branch }}"
            echo "Branch: ${{ github.event.client_payload.branch }}"
            echo "Version: ${{ github.event.client_payload.version }}"
            echo "SHA: ${{ github.event.client_payload.sha }}"
            echo "=== End ==="

            echo "Docker Compose deployment started"

